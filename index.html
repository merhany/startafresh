<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="자산 계산기"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>자산 손익 계산기</title><style>
:root{color-scheme:dark;--bg:#101827;--card:#1b2738;--muted:#9cadc2;--text:#f5f7fb;--green:#54d6a0;--red:#ff7884;--blue:#83b7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#293b59,var(--bg) 62%);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;padding:calc(24px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}.wrap{max-width:480px;margin:auto}.eyebrow{color:var(--blue);font-weight:700;font-size:13px;letter-spacing:.08em}.title{font-size:29px;margin:8px 0 5px}.sub{margin:0 0 25px;color:var(--muted);font-size:14px}.field-label{display:block;font-size:14px;color:#c5d0df;margin-bottom:9px}.entry{display:flex;align-items:center;background:var(--card);border:1px solid #34445a;border-radius:16px;padding:0 16px;height:60px;margin-bottom:14px}.entry input{width:100%;background:none;border:0;outline:0;color:var(--text);font-size:22px;font-weight:700}.entry span{color:var(--muted);font-size:18px}.button{width:100%;border:0;border-radius:15px;padding:17px;background:#79aefa;color:#102038;font-size:17px;font-weight:800;margin:2px 0 21px;cursor:pointer}.cards{display:grid;gap:12px}.card{background:linear-gradient(145deg,#202e43,#192536);border:1px solid #2b3b51;border-radius:17px;padding:18px}.card-title{font-size:13px;color:var(--muted);margin-bottom:12px}.amount{font-size:27px;font-weight:800;letter-spacing:-.03em}.percent{font-size:15px;font-weight:700;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.neutral{color:var(--muted)}.divider{height:1px;background:#34445a;margin:15px 0}.mini{color:var(--muted);font-size:13px}.history{margin-top:16px;color:var(--muted);font-size:12px;text-align:center}.hint{margin:18px 2px 0;color:#9cadc2;font-size:12px;line-height:1.6;text-align:center}.settings{margin-top:22px;border:1px solid #34445a;border-radius:15px;background:#182436;padding:15px}.settings summary{font-weight:700;cursor:pointer}.setting-row{margin-top:14px}.setting-row input{width:100%;background:#101827;border:1px solid #34445a;border-radius:10px;color:var(--text);padding:12px;font-size:17px}.setting-button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:11px;background:#344b68;color:white;font-weight:700;font-size:15px}button:active{transform:scale(.99)}
</style></head><body><main class="wrap"><div class="eyebrow">MY PORTFOLIO</div><h1 class="title">자산 손익 계산기</h1><p class="sub">현재 자산을 입력하면 손익과 변동을 계산해요.</p><label class="field-label" for="asset">현재 자산</label><div class="entry"><input id="asset" type="text" inputmode="numeric" autocomplete="off" aria-label="현재 자산" value=""><span>원</span></div><button class="button" id="calc">손익 계산하기</button><section class="cards" aria-live="polite"><article class="card"><div class="card-title">원금 대비 손익</div><div class="amount" id="pnl">—</div><div class="percent" id="pnlPct">—</div><div class="divider"></div><div class="mini">초기 원금 설정 필요</div></article><article class="card"><div class="card-title">직전 자산 대비 증감</div><div class="amount" id="change">—</div><div class="percent" id="changePct">—</div><div class="divider"></div><div class="mini" id="baselineText">직전 기준 설정 필요</div></article></section><div class="history" id="saved">직전 기준은 이 기기에 자동 저장됩니다.</div><p class="hint">계산할 때 입력한 자산이 다음 계산의 직전 기준으로 저장돼요.</p><details class="settings" open><summary>초기 금액 설정</summary><div class="setting-row"><label class="field-label" for="currentSetting">현재 자산 기본값</label><input id="currentSetting" inputmode="numeric" value=""></div><div class="setting-row"><label class="field-label" for="principalSetting">원금</label><input id="principalSetting" inputmode="numeric" value=""></div><div class="setting-row"><label class="field-label" for="previousSetting">직전 자산 기준</label><input id="previousSetting" inputmode="numeric" value=""></div><button class="setting-button" id="saveSettings">설정 저장 및 계산</button></details></main><script>
(()=>{const KEY='asset-calculator-settings-v1',input=document.querySelector('#asset'),currentSetting=document.querySelector('#currentSetting'),principalInput=document.querySelector('#principalSetting'),previousInput=document.querySelector('#previousSetting');let settings={principal:0,previous:0,current:0};try{settings={...settings,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}if(settings.current)input.value=Number(settings.current).toLocaleString('ko-KR');currentSetting.value=settings.current?Number(settings.current).toLocaleString('ko-KR'):'';principalInput.value=settings.principal?Number(settings.principal).toLocaleString('ko-KR'):'';previousInput.value=settings.previous?Number(settings.previous).toLocaleString('ko-KR'):'';const fmt=n=>Math.round(n).toLocaleString('ko-KR'),signed=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n))+'원',number=e=>Number(e.value.replace(/[^0-9]/g,''));function paint(save=true){const current=number(input),principal=Number(settings.principal),previous=Number(settings.previous);if(!Number.isFinite(current)||current<0||!Number.isFinite(principal)||principal<=0||!Number.isFinite(previous)||previous<0)return;const pnl=current-principal,delta=current-previous;document.querySelector('#pnl').textContent=signed(pnl);document.querySelector('#pnlPct').textContent=(pnl>0?'+':pnl<0?'−':'')+Math.abs(pnl/principal*100).toFixed(2)+'%';document.querySelector('#change').textContent=signed(delta);document.querySelector('#changePct').textContent=(delta>0?'+':delta<0?'−':'')+Math.abs(previous?delta/previous*100:0).toFixed(2)+'%';for(const [id,n] of [['pnl',pnl],['pnlPct',pnl],['change',delta],['changePct',delta]]){const el=document.getElementById(id);el.className=(n>0?'green':n<0?'red':'neutral')+(id.endsWith('Pct')?' percent':' amount')}document.querySelector('.mini').textContent='초기 원금 '+fmt(principal)+'원';document.querySelector('#baselineText').textContent='직전 기준 '+fmt(previous)+'원';if(save){settings.previous=current;settings.current=current;currentSetting.value=fmt(current);previousInput.value=fmt(current);try{localStorage.setItem(KEY,JSON.stringify(settings));document.querySelector('#saved').textContent='방금 계산한 자산을 다음 직전 기준으로 저장했어요.'}catch{document.querySelector('#saved').textContent='브라우저 저장 기능을 사용할 수 없습니다.'}}}document.querySelector('#calc').addEventListener('click',()=>paint(true));document.querySelector('#saveSettings').addEventListener('click',()=>{const principal=number(principalInput),previous=number(previousInput),current=number(currentSetting);if(!principal){document.querySelector('#saved').textContent='원금은 0보다 큰 금액으로 입력해 주세요.';return}settings={principal,previous,current};input.value=current.toLocaleString('ko-KR');try{localStorage.setItem(KEY,JSON.stringify(settings))}catch{}paint(true);document.querySelector('#saved').textContent='초기 금액을 저장했고 현재 자산을 다음 직전 기준으로 저장했어요.'});input.addEventListener('keydown',e=>{if(e.key==='Enter')paint(true)});if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));paint(false)})();
</script></body></html>
